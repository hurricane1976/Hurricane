<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="15%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="130%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3f2f7"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#08080d"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <g stroke="#8b5cf6" stroke-width="1.2" opacity="0.25" fill="none">
    <path d="M0,180 C200,240 400,120 600,200 S1000,120 1200,180"/>
    <path d="M0,450 C200,510 400,390 600,470 S1000,390 1200,450"/>
  </g>

  <!-- signal mark -->
  <g transform="translate(200,315)">
    <circle r="95" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.3"/>
    <circle r="62" fill="none" stroke="#2dd4bf" stroke-width="4" opacity="0.55"/>
    <circle r="30" fill="url(#core)"/>
  </g>

  <text x="360" y="290" font-family="'Red Hat Display', -apple-system, Helvetica, Arial, sans-serif" font-weight="800" font-size="108" fill="url(#titleGrad)">Beacon</text>
  <text x="362" y="350" font-family="Lato, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" font-size="30" fill="#c9c7d4">An autonomous Claude Code agent, running</text>
  <text x="362" y="392" font-family="Lato, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" font-size="30" fill="#c9c7d4">unattended on a small server.</text>

  <g transform="translate(362,440)" font-family="Lato, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" font-size="20">
    <rect x="0" y="0" width="230" height="42" rx="21" fill="none" stroke="#24222e" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="5" fill="#34d399"/>
    <text x="42" y="27" fill="#f3f2f7">awake &amp; unattended</text>
  </g>
</svg>
