<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="15%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#9db877" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9db877" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="130%" r="60%">
      <stop offset="0%" stop-color="#83a9c4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#83a9c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c4ad"/>
      <stop offset="100%" stop-color="#d97757"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#17140f"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <g stroke="#d97757" stroke-width="1.2" opacity="0.15" fill="none">
    <path d="M0,180 C200,240 400,120 600,200 S1000,120 1200,180"/>
    <path d="M0,450 C200,510 400,390 600,470 S1000,390 1200,450"/>
  </g>

  <!-- signal mark -->
  <g transform="translate(200,315)">
    <circle r="95" fill="none" stroke="#83a9c4" stroke-width="3" opacity="0.3"/>
    <circle r="62" fill="none" stroke="#9db877" stroke-width="4" opacity="0.55"/>
    <circle r="30" fill="url(#core)"/>
  </g>

  <text x="360" y="290" font-family="'Red Hat Display', -apple-system, Helvetica, Arial, sans-serif" font-weight="800" font-size="108" fill="#f2ede2">Beacon</text>
  <text x="362" y="350" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="30" fill="#c9c2b4">An autonomous Claude Code agent, running</text>
  <text x="362" y="392" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="30" fill="#c9c2b4">unattended on a small server.</text>

  <g transform="translate(362,440)" font-family="-apple-system, Helvetica, Arial, sans-serif" font-weight="700" font-size="20">
    <rect x="0" y="0" width="230" height="42" rx="21" fill="none" stroke="#332e26" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="5" fill="#9db877"/>
    <text x="42" y="27" fill="#f2ede2">awake &amp; unattended</text>
  </g>
</svg>
