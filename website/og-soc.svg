<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow-terracotta" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-navy" cx="85%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#3d5a80" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3d5a80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-teal" cx="50%" cy="115%" r="65%">
      <stop offset="0%" stop-color="#9db877" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#9db877" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shield-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c4ad"/>
      <stop offset="100%" stop-color="#d97757"/>
    </radialGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#332e26" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3d5a80" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#17140f"/>
  <rect width="1200" height="630" fill="url(#glow-terracotta)"/>
  <rect width="1200" height="630" fill="url(#glow-navy)"/>
  <rect width="1200" height="630" fill="url(#glow-teal)"/>

  <!-- Ambient Wave Vectors -->
  <g stroke="#d97757" stroke-width="1.2" opacity="0.12" fill="none">
    <path d="M0,140 C350,200 650,80 950,160 S1150,100 1200,140"/>
    <path d="M0,330 C280,410 580,270 880,350 S1100,290 1200,330"/>
    <path d="M0,520 C320,580 620,460 920,540 S1150,490 1200,520"/>
  </g>

  <!-- Central Card Container -->
  <rect x="80" y="60" width="1040" height="510" rx="24" fill="#1c1811" fill-opacity="0.88" stroke="url(#card-border)" stroke-width="1.5"/>

  <!-- Top Brand Mark & Category Tag -->
  <g transform="translate(130, 115)">
    <circle cx="18" cy="18" r="16" fill="none" stroke="#83a9c4" stroke-width="2" opacity="0.35"/>
    <circle cx="18" cy="18" r="10" fill="none" stroke="#9db877" stroke-width="2.2" opacity="0.6"/>
    <circle cx="18" cy="18" r="5" fill="#d97757"/>
    <text x="46" y="24" font-family="'Red Hat Display', -apple-system, sans-serif" font-weight="700" font-size="22" fill="#f2ede2" letter-spacing="0.5">BEACON</text>
    <text x="150" y="24" font-family="-apple-system, sans-serif" font-weight="600" font-size="15" fill="#a89d8c" letter-spacing="1.5">// SECURITY ARCHITECTURE</text>
  </g>

  <!-- Left: SOC Shield & Gate Graphic -->
  <g transform="translate(230, 335)">
    <circle r="105" fill="none" stroke="#3d5a80" stroke-width="2" opacity="0.3" stroke-dasharray="6,6"/>
    <circle r="80" fill="none" stroke="#d97757" stroke-width="2.5" opacity="0.4"/>
    
    <!-- Shield Icon -->
    <path d="M0 -55 L45 -35 V5 C45 35 0 65 0 65 C0 65 -45 35 -45 5 V-35 Z" fill="#201c16" stroke="#d97757" stroke-width="2.5"/>
    <circle cx="0" cy="5" r="18" fill="url(#shield-core)"/>
    <path d="M-6 5 L-1 10 L8 -1" fill="none" stroke="#17140f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: Title, Subtitle, and Badges -->
  <g transform="translate(390, 235)">
    <text x="0" y="32" font-family="'Red Hat Display', -apple-system, sans-serif" font-weight="800" font-size="64" fill="#f2ede2" letter-spacing="-1">Autonomous SOC</text>
    
    <text x="0" y="85" font-family="'Source Serif 4', Georgia, serif" font-weight="400" font-size="24" fill="#c9c2b4">
      Multiagent Incident Response &amp; Triage
    </text>
    <text x="0" y="120" font-family="'Source Serif 4', Georgia, serif" font-weight="400" font-size="19" fill="#a89d8c">
      Triage, enrichment, and reversible containment, with mandatory human gates.
    </text>

    <!-- Badges / Pills -->
    <g transform="translate(0, 165)" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">
      <rect x="0" y="0" width="186" height="34" rx="17" fill="#201c16" stroke="#332e26" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="4" fill="#d97757"/>
      <text x="28" y="22" fill="#f2ede2">SIEM / SOAR Record</text>

      <rect x="201" y="0" width="164" height="34" rx="17" fill="#201c16" stroke="#332e26" stroke-width="1.2"/>
      <circle cx="217" cy="17" r="4" fill="#9db877"/>
      <text x="229" y="22" fill="#f2ede2">8 SOC Subagents</text>

      <rect x="380" y="0" width="224" height="34" rx="17" fill="#201c16" stroke="#332e26" stroke-width="1.2"/>
      <circle cx="396" cy="17" r="4" fill="#83a9c4"/>
      <text x="408" y="22" fill="#f2ede2">Human Eradication Gate</text>
    </g>
  </g>

  <!-- Bottom URL Bar -->
  <g transform="translate(130, 525)">
    <text x="0" y="0" font-family="'Red Hat Display', -apple-system, sans-serif" font-weight="700" font-size="16" fill="#9db877">beaconwake.com/soc-architecture.html</text>
    <text x="940" y="0" text-anchor="end" font-family="-apple-system, sans-serif" font-weight="500" font-size="14" fill="#a89d8c">Incident Response Blueprint</text>
  </g>
</svg>