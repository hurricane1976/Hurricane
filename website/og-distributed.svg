<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow-amber" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-teal" cx="85%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a6f5ec"/>
      <stop offset="100%" stop-color="#4fd1c5"/>
    </radialGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="rgba(232,234,237,0.12)"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#0a0d13"/>
  <rect width="1200" height="630" fill="url(#glow-amber)"/>
  <rect width="1200" height="630" fill="url(#glow-teal)"/>

  <!-- Background Grid Pattern -->
  <g stroke="rgba(232,234,237,0.035)" stroke-width="1">
    <line x1="0" y1="64" x2="1200" y2="64"/>
    <line x1="0" y1="128" x2="1200" y2="128"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
    <line x1="0" y1="256" x2="1200" y2="256"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="384" x2="1200" y2="384"/>
    <line x1="0" y1="448" x2="1200" y2="448"/>
    <line x1="0" y1="512" x2="1200" y2="512"/>
    <line x1="0" y1="576" x2="1200" y2="576"/>
    <line x1="64" y1="0" x2="64" y2="630"/>
    <line x1="128" y1="0" x2="128" y2="630"/>
    <line x1="192" y1="0" x2="192" y2="630"/>
    <line x1="256" y1="0" x2="256" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="384" y1="0" x2="384" y2="630"/>
    <line x1="448" y1="0" x2="448" y2="630"/>
    <line x1="512" y1="0" x2="512" y2="630"/>
    <line x1="576" y1="0" x2="576" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="704" y1="0" x2="704" y2="630"/>
    <line x1="768" y1="0" x2="768" y2="630"/>
    <line x1="832" y1="0" x2="832" y2="630"/>
    <line x1="896" y1="0" x2="896" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1024" y1="0" x2="1024" y2="630"/>
    <line x1="1088" y1="0" x2="1088" y2="630"/>
    <line x1="1152" y1="0" x2="1152" y2="630"/>
  </g>

  <!-- Central Card Container -->
  <rect x="70" y="55" width="1060" height="520" rx="4" fill="#10151d" fill-opacity="0.9" stroke="url(#card-border)" stroke-width="1"/>

  <!-- Eyebrow & Brand Mark -->
  <g transform="translate(120, 115)">
    <circle cx="12" cy="12" r="6" fill="#ff8a3d"/>
    <circle cx="12" cy="12" r="12" fill="none" stroke="#4fd1c5" stroke-width="1.5" opacity="0.6"/>
    <text x="36" y="16" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#e8eaed" letter-spacing="-0.5">BEACON</text>
    <text x="140" y="16" font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="13" fill="#4fd1c5" letter-spacing="1.5">// ARCHITECTURE REFERENCE</text>
  </g>

  <!-- Left: P2P Mesh Ring, No Hub -->
  <g transform="translate(230, 325)">
    <circle r="105" fill="none" stroke="#4fd1c5" stroke-width="1.5" opacity="0.2" stroke-dasharray="4,6"/>

    <!-- Pentagon ring + star chords (peer-to-peer: every node reaches every node) -->
    <g fill="none" stroke="#4fd1c5" stroke-width="1.6" opacity="0.55">
      <polygon points="0,-78 -74,-24 -46,63 46,63 74,-24"/>
      <path d="M 0 -78 L 46 63 L 74 -24 L -46 63 L -74 -24 Z"/>
    </g>

    <!-- 5 peer nodes -->
    <circle cx="0" cy="-78" r="14" fill="url(#node-core)"/>
    <circle cx="0" cy="-78" r="6" fill="#0a0d13"/>
    <circle cx="-74" cy="-24" r="14" fill="url(#node-core)"/>
    <circle cx="-74" cy="-24" r="6" fill="#0a0d13"/>
    <circle cx="-46" cy="63" r="14" fill="#ff8a3d"/>
    <circle cx="-46" cy="63" r="6" fill="#0a0d13"/>
    <circle cx="46" cy="63" r="14" fill="url(#node-core)"/>
    <circle cx="46" cy="63" r="6" fill="#0a0d13"/>
    <circle cx="74" cy="-24" r="14" fill="#ff8a3d"/>
    <circle cx="74" cy="-24" r="6" fill="#0a0d13"/>

    <!-- Struck-through hub: no central orchestrator -->
    <circle cx="0" cy="0" r="13" fill="#0a0d13" stroke="#a7b4c8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M -9 9 L 9 -9" stroke="#ff8a3d" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Caption -->
    <text x="0" y="130" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="9" fill="#4fd1c5" letter-spacing="1.5">NO CENTRAL ORCHESTRATOR</text>
  </g>

  <!-- Right: Title, Subtitle, and Model Tags -->
  <g transform="translate(390, 225)">
    <text x="0" y="38" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="64" fill="#e8eaed" letter-spacing="-1">Distributed Agents<tspan fill="#ff8a3d">.</tspan></text>

    <text x="0" y="85" font-family="'IBM Plex Sans', sans-serif" font-weight="400" font-size="22" fill="#e8eaed">
      Peer-to-Peer Multiagent Coordination
    </text>
    <text x="0" y="118" font-family="'IBM Plex Sans', sans-serif" font-weight="300" font-size="17" fill="#8b93a1">
      Centralized vs peer-to-peer vs hybrid &#8212; how a real 21-agent fleet picks its shape.
    </text>

    <!-- Architecture Badges / Pills -->
    <g transform="translate(0, 160)" font-family="'IBM Plex Mono', monospace" font-size="12.5">
      <rect x="0" y="0" width="210" height="34" rx="2" fill="#161d27" stroke="rgba(232,234,237,0.1)"/>
      <circle cx="16" cy="17" r="3.5" fill="#4fd1c5"/>
      <text x="28" y="22" fill="#e8eaed">no central orchestrator</text>

      <rect x="225" y="0" width="218" height="34" rx="2" fill="#161d27" stroke="rgba(232,234,237,0.1)"/>
      <circle cx="241" cy="17" r="3.5" fill="#4fd1c5"/>
      <text x="253" y="22" fill="#e8eaed">human gate without a hub</text>

      <rect x="458" y="0" width="225" height="34" rx="2" fill="#161d27" stroke="rgba(232,234,237,0.1)"/>
      <circle cx="474" cy="17" r="3.5" fill="#ff8a3d"/>
      <text x="486" y="22" fill="#e8eaed">hybrid: where fleets land</text>
    </g>
  </g>

  <!-- Bottom URL Bar -->
  <g transform="translate(120, 525)">
    <text x="0" y="0" font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="14" fill="#4fd1c5">https://www.beaconwake.com/distributed-agents.html</text>
    <text x="960" y="0" text-anchor="end" font-family="'IBM Plex Sans', sans-serif" font-weight="400" font-size="14" fill="#8b93a1">Multiagent Systems Architecture</text>
  </g>
</svg>
